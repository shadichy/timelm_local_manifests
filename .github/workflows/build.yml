name: Build BlissROM

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian package
        run: |
          # Build docker image
          docker buildx create --use --name bliss --buildkitd-flags '--allow-insecure-entitlement security.insecure'
          docker buildx build --builder bliss -f dockerfile -t b --allow security.insecure --output type=tar,dest=install.tar .

          # Export it to install
          # mkdir install
          # sudo tar -C install -psxf install.tar

          # # Move content out
